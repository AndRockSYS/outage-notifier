name: Update outage schedule

on:
    schedule:
        - cron: "5 * * * *"
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.commit.outputs.changed }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Generate outage schedule
              run: node src/index.js
              env:
                  API_URL: ${{ vars.API_URL }}

            - name: Commit changes
              id: commit
              run: |
                  if [ -n "$(git status --porcelain data)" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add data
                    git commit -m "Update outage schedule"
                    git push
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Nothing to commit."
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        needs: update
        # Deploy only when the file changed, or when you run it manually
        if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main # pick up the commit made by the update job

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: ./data

            - id: deployment
              uses: actions/deploy-pages@v4
